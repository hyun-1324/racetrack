<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Board</title>
    <script type="module" src="/public/js/leaderBoard.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>socket = io();</script>
    <link rel="stylesheet" href="/public/css/leaderBoard.css">
</head>
<body>
    <div id="raceinfo">
        <div id="session">Session: <span id="sessionNumber">-</span> </div>
        <div id="timer">00:00:00</div>
        <div id="flag"></div>
    </div>
    <h1>Leader Board</h1>
    <table id="leaderBoard">
        <tr>
            <th>Car</th>
            <th>Driver</th>
            <th>Current lap</th>
            <th>Fastest lap</th>
        </tr>
    </table>
    <div id="noSessionMessage">No active race session</div>
    <button id="fullScreenButton">Full screen</button>
</body>
</html>
