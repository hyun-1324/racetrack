<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safety Official</title>
    <script type="module" src="/public/js/safety.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      socket = io();
    </script>
    <link rel="stylesheet" href="/public/css/safety.css" />
  </head>
  <body>
    <div id="headerBox">
      <h2>Safety control</h2>
      <div class="timer" id="timer">00:00:00</div>
      <div id="mainControllerContainer">
        <div id="currentModeBox">
          Current Mode: <span id="currentMode">Danger</span>
        </div>
        <div class="buttons">
          <button id="start" disabled>Start Race</button>
          <button id="end" disabled>End Session</button>
        </div>
      </div>
    </div>
   
    <div class="modeButtons">
      <div id="flexButtons">
        <h2>Race modes</h3>
        <button id="safe" disabled>Safe</button>
        <button id="hazard" disabled>Hazard</button>
        <button id="danger" disabled>Danger</button>
        <button id="finish" disabled>Finish</button>
      </div>
    </div>

    <div id="sessionInfo">
      <h2>Session ID: <span id="sessionId">0</span></h2>
      <div id="sessionInfoGrid">
        <div class="gridItem">
          <div class="carNum">Car 1</div>
          <div id="car1" class="driverName"></div>
        </div>
        <div class="gridItem">
          <div class="carNum">Car 2</div>
          <div id="car2" class="driverName"></div>
        </div>
        <div class="gridItem">
          <div class="carNum">Car 3</div>
          <div id="car3" class="driverName"></div>
        </div>
        <div class="gridItem">
          <div class="carNum">Car 4</div>
          <div id="car4" class="driverName"></div>
        </div>
        <div class="gridItem">
          <div class="carNum">Car 5</div>
          <div id="car5" class="driverName"></div>
        </div>
        <div class="gridItem">
          <div class="carNum">Car 6</div>
          <div id="car6" class="driverName"></div>
        </div>
        <div class="gridItem">
          <div class="carNum">Car 7</div>
          <div id="car7" class="driverName"></div>
        </div>
        <div class="gridItem">
          <div class="carNum">Car 8</div>
          <div id="car8" class="driverName"></div>
        </div>
      </div>
    </div>
    <p id="noRaces">No Upcoming Race</p>
  </body>
</html>
